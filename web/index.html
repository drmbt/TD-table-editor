<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD Table Editor</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <span id="targetname" title="target table DAT">&mdash;</span>
    <span id="robadge" hidden>READ-ONLY</span>
    <input id="filter" type="text" placeholder="filter rows&hellip;" spellcheck="false">
    <button id="btn-addrow" title="append a row">+ Row</button>
    <button id="btn-addcol" title="append a column">+ Col</button>
    <button id="btn-applysort" title="write the current sort order into the DAT" disabled>Apply Sort</button>
    <label id="hdrtoggle" title="treat the first DAT row as the column header">
      <input type="checkbox" id="headerrow"> header row
    </label>
    <span class="flexspacer"></span>
    <span id="conn" class="conn down" title="connection">&#9679;</span>
  </header>
  <div id="grid"></div>
  <footer id="statusbar">
    <span id="dims"></span>
    <span id="selinfo"></span>
    <span class="flexspacer"></span>
    <span id="hint"></span>
  </footer>
</div>
<script src="js/bridge.js"></script>
<script src="js/grid.js"></script>
<script src="js/main.js"></script>
</body>
</html>
